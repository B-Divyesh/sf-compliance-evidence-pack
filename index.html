<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071217" />
    <meta name="description" content="Prepare a calm, local-first packet of filing-period evidence for your accountant." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Deadline Packet — accountant-ready evidence, kept local</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <a class="brand" href="/" data-route aria-label="Deadline Packet home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>Deadline</strong> Packet</span>
      </a>
      <nav aria-label="Primary navigation">
        <div class="status-badge" id="network-status" role="status" aria-live="polite">
          <span aria-hidden="true"></span><b>Local</b> <em>Online</em>
        </div>
        <button class="ghost install-button" id="install-button" type="button" hidden>Install app</button>
        <a href="/privacy" data-route>Privacy</a>
        <a href="/terms" data-route>Terms</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading-state" role="status">
        <span class="loader" aria-hidden="true"></span>
        <p>Opening your local packet drawer…</p>
      </div>
    </main>
    <footer class="site-footer">
      <p>Your documents stay in this browser. Nothing is sent automatically.</p>
      <p>Original still-life artwork was AI-generated for Deadline Packet. <a href="/privacy" data-route>How privacy works</a></p>
    </footer>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
